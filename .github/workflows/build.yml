name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v5
        with:
          path: BabelDocKit/runtime
          key: babeldoc-runtime-${{ hashFiles('BabelDocKit/resources/runtime-manifest.json') }}
      - run: npm run sync:babeldoc
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  latex-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/latex-trans-parity.test.ts tests/latex-trans-kit.test.ts

  package:
    needs: [validate, latex-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            command: package:mac:arm64
            artifact_platform: macOS-arm64
          - os: macos-15
            command: package:mac:x64
            artifact_platform: macOS-x64
          - os: windows-2025
            command: package:win:arm64
            artifact_platform: Windows-arm64
          - os: windows-2025
            command: package:win:x64
            artifact_platform: Windows-x64
          - os: ubuntu-24.04
            command: package:linux:arm64
            artifact_platform: Linux-arm64
          - os: ubuntu-24.04
            command: package:linux:x64
            artifact_platform: Linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v5
        with:
          path: BabelDocKit/runtime
          key: babeldoc-runtime-${{ hashFiles('BabelDocKit/resources/runtime-manifest.json') }}
      - run: npm run sync:babeldoc
      - run: npm run ${{ matrix.command }} -- --publish never

      - name: Resolve artifact name
        id: artifact_meta
        shell: bash
        run: |
          app_version="$(node -p "require('./package.json').version")"
          echo "artifact_name=Freddie-${app_version}-${{ matrix.artifact_platform }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.artifact_meta.outputs.artifact_name }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -lh dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Freddie $TAG" --generate-notes --verify-tag
          fi
