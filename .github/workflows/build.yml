name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  latex-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/latex-trans-parity.test.ts tests/latex-trans-kit.test.ts

  package:
    needs: [validate, latex-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            command: package:mac
          - os: windows-2025
            command: package:win
          - os: ubuntu-24.04
            command: package:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.command }} -- --publish never

      - name: Resolve artifact name
        id: artifact_meta
        shell: bash
        run: |
          app_version="$(node -p "require('./package.json').version")"
          echo "artifact_name=Freddie-${app_version}-${RUNNER_OS}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.artifact_meta.outputs.artifact_name }}
          if-no-files-found: error
          path: release/*
